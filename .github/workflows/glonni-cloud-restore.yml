name: Glonni restore to isolated Supabase project

on:
  workflow_dispatch:
    inputs:
      backup_folder:
        description: Exact folder name under Glonni-backups in Google Drive
        required: true
        type: string
      confirm:
        description: Type RESTORE_TO_ISOLATED_PROJECT to proceed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glonni-cloud-restore
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ inputs.confirm == 'RESTORE_TO_ISOLATED_PROJECT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install restore tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rclone

      - name: Check credentials and block production target
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESTORE_PROJECT_REF: ${{ secrets.RESTORE_PROJECT_REF }}
          RESTORE_DB_HOST: ${{ secrets.RESTORE_DB_HOST }}
          RESTORE_DB_PORT: ${{ secrets.RESTORE_DB_PORT }}
          RESTORE_DB_NAME: ${{ secrets.RESTORE_DB_NAME }}
          RESTORE_DB_USER: ${{ secrets.RESTORE_DB_USER }}
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
          RESTORE_S3_ENDPOINT: ${{ secrets.RESTORE_S3_ENDPOINT }}
          RESTORE_S3_REGION: ${{ secrets.RESTORE_S3_REGION }}
          RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.RESTORE_S3_ACCESS_KEY_ID }}
          RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_S3_SECRET_ACCESS_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          BACKUP_FOLDER: ${{ inputs.backup_folder }}
        run: |
          set -euo pipefail
          required=(
            SUPABASE_PROJECT_REF RESTORE_PROJECT_REF RESTORE_DB_HOST RESTORE_DB_PORT
            RESTORE_DB_NAME RESTORE_DB_USER RESTORE_DB_PASSWORD RESTORE_S3_ENDPOINT
            RESTORE_S3_REGION RESTORE_S3_ACCESS_KEY_ID RESTORE_S3_SECRET_ACCESS_KEY
            GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_TOKEN_JSON
            GOOGLE_DRIVE_ROOT_FOLDER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          if [[ ! "$BACKUP_FOLDER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Backup folder must be a single folder name with no path separators."
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ || ! "$RESTORE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Project references must be 20-character Supabase project references."
            exit 1
          fi
          if [[ "$RESTORE_PROJECT_REF" == "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Restore blocked: target project is the production source project."
            exit 1
          fi
          if [[ "$RESTORE_DB_USER" != "postgres.$RESTORE_PROJECT_REF" ]]; then
            echo "::error::Restore target username must be the Session Pooler username for RESTORE_PROJECT_REF."
            exit 1
          fi
          if [[ "$RESTORE_S3_ENDPOINT" != *"$RESTORE_PROJECT_REF.storage.supabase.co"* ]]; then
            echo "::error::Restore Storage endpoint does not match RESTORE_PROJECT_REF."
            exit 1
          fi
          docker --version >/dev/null
          echo "Credentials are present; production-project reference checks passed."

      - name: Download and validate backup from private Drive
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          BACKUP_FOLDER: ${{ inputs.backup_folder }}
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          umask 077
          work_dir="${RUNNER_TEMP}/glonni-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -p "$work_dir/archive" "$work_dir/database" "$work_dir/storage"
          rclone copy --log-level ERROR "gdrive:Glonni-backups/$BACKUP_FOLDER" "$work_dir/archive"
          for file in database.tar.gz storage.tar.gz SHA256SUMS manifest.txt VERIFIED.txt; do
            if [[ ! -s "$work_dir/archive/$file" ]]; then
              echo "::error::Backup is incomplete: $file is missing."
              exit 1
            fi
          done
          (
            cd "$work_dir/archive"
            sha256sum --check SHA256SUMS
          )
          tar -xzf "$work_dir/archive/database.tar.gz" -C "$work_dir/database"
          tar -xzf "$work_dir/archive/storage.tar.gz" -C "$work_dir/storage"
          for file in roles.sql schema.sql data.sql migrations-schema.sql migrations-data.sql; do
            if [[ ! -s "$work_dir/database/$file" ]]; then
              echo "::error::Database archive is missing $file."
              exit 1
            fi
          done
          if ! find "$work_dir/storage" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            echo "::error::Storage archive contains no bucket folders."
            exit 1
          fi
          echo "Drive backup downloaded and its checksums and archive contents passed validation."
          echo "work_dir=$work_dir" >> "$GITHUB_ENV"

      - name: Restore database to the isolated Supabase target
        shell: bash
        env:
          RESTORE_DB_HOST: ${{ secrets.RESTORE_DB_HOST }}
          RESTORE_DB_PORT: ${{ secrets.RESTORE_DB_PORT }}
          RESTORE_DB_NAME: ${{ secrets.RESTORE_DB_NAME }}
          RESTORE_DB_USER: ${{ secrets.RESTORE_DB_USER }}
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGHOST="$RESTORE_DB_HOST" \
            -e PGPORT="$RESTORE_DB_PORT" \
            -e PGDATABASE="$RESTORE_DB_NAME" \
            -e PGUSER="$RESTORE_DB_USER" \
            -e PGPASSWORD="$RESTORE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            -v "$work_dir/database:/backup:ro" \
            postgres:17-alpine \
            psql --no-psqlrc --single-transaction --set=ON_ERROR_STOP=1 \
              --file=/backup/roles.sql \
              --file=/backup/schema.sql \
              --file=/backup/migrations-schema.sql \
              --command='SET session_replication_role = replica' \
              --file=/backup/data.sql \
              --file=/backup/migrations-data.sql
          unset RESTORE_DB_PASSWORD
          echo "Database restore completed on the isolated target."

      - name: Restore Storage files and verify them
        shell: bash
        env:
          RESTORE_PROJECT_REF: ${{ secrets.RESTORE_PROJECT_REF }}
          RESTORE_S3_ENDPOINT: ${{ secrets.RESTORE_S3_ENDPOINT }}
          RESTORE_S3_REGION: ${{ secrets.RESTORE_S3_REGION }}
          RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.RESTORE_S3_ACCESS_KEY_ID }}
          RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_RESTORE_TYPE: s3
          RCLONE_CONFIG_RESTORE_PROVIDER: Other
          RCLONE_CONFIG_RESTORE_ACCESS_KEY_ID: ${{ secrets.RESTORE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_RESTORE_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_RESTORE_ENDPOINT: ${{ secrets.RESTORE_S3_ENDPOINT }}
          RCLONE_CONFIG_RESTORE_REGION: ${{ secrets.RESTORE_S3_REGION }}
          RCLONE_CONFIG_RESTORE_FORCE_PATH_STYLE: "true"
        run: |
          set -euo pipefail
          bucket_count=0
          object_count=0
          for bucket_dir in "$work_dir/storage"/*; do
            [[ -d "$bucket_dir" ]] || continue
            bucket="$(basename "$bucket_dir")"
            bucket_count=$((bucket_count + 1))
            rclone copy --log-level ERROR --transfers 4 --checkers 8 "$bucket_dir" "restore:$bucket"
            rclone check --log-level ERROR --download --one-way "$bucket_dir" "restore:$bucket"
            object_count=$((object_count + $(find "$bucket_dir" -type f | wc -l | tr -d '[:space:]')))
          done
          if (( bucket_count == 0 )); then
            echo "::error::No Storage buckets were restored."
            exit 1
          fi
          {
            printf 'Isolated target project: %s\n' "$RESTORE_PROJECT_REF"
            printf 'Restored Storage buckets: %s\n' "$bucket_count"
            printf 'Restored Storage files: %s\n' "$object_count"
            printf 'Database restore: completed.\n'
            printf 'Storage checksum verification: passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Supabase restore completed and Storage object verification passed."

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Glonni isolated restore failed"
            echo "The run may have partially written to the isolated target. Do not use that target until reviewed."
            echo "GitHub Actions notifications must be enabled for the repository owner to receive failure alerts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary restore files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/glonni-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$work_dir" ]]; then
            rm -rf -- "$work_dir"
          fi
