name: Glonni encrypted cloud backup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BACKUP to start a read-only export
        required: true
        type: string

permissions: {}

concurrency:
  group: glonni-cloud-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ inputs.confirm == 'BACKUP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SUPABASE_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      RCLONE_CONFIG_SUPABASE_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      RCLONE_CONFIG_SUPABASE_FORCE_PATH_STYLE: "true"

    steps:
      - name: Check required credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_NAME SUPABASE_DB_USER
            SUPABASE_DB_PASSWORD SUPABASE_S3_ENDPOINT SUPABASE_S3_REGION
            SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY
            GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_TOKEN_JSON
            GOOGLE_DRIVE_ROOT_FOLDER_ID BACKUP_ENCRYPTION_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          command -v docker >/dev/null
          echo "Required secret names are present; values were not displayed."

      - name: Install transfer and encryption tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rclone gnupg ca-certificates

      - name: Export, encrypt, verify, and upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP}/glonni-backup.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          mkdir -m 700 -p "$work_dir/storage" "$work_dir/upload"
          key_file="$work_dir/.encryption-key"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" > "$key_file"
          unset BACKUP_ENCRYPTION_KEY
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          remote_dir="gdrive:Glonni-backups/${stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          pg_base_image="postgres:18-alpine"
          server_version_num="$(docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE=require \
            -e PGHOST="$SUPABASE_DB_HOST" -e PGPORT="$SUPABASE_DB_PORT" \
            -e PGUSER="$SUPABASE_DB_USER" -e PGDATABASE="$SUPABASE_DB_NAME" \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            "$pg_base_image" psql --no-psqlrc --tuples-only --no-align \
            --command='SHOW server_version_num')"
          server_version_num="$(printf '%s' "$server_version_num" | tr -d '[:space:]')"
          if [[ ! "$server_version_num" =~ ^[0-9]{5,6}$ ]]; then
            echo "::error::Could not safely determine the PostgreSQL server major version."
            exit 1
          fi
          server_major=$((server_version_num / 10000))
          client_major=18
          if (( server_major > client_major )); then client_major="$server_major"; fi
          pg_image="postgres:${client_major}-alpine"

          docker run --rm --network host \
            -e PGHOST="$SUPABASE_DB_HOST" -e PGPORT="$SUPABASE_DB_PORT" \
            -e PGUSER="$SUPABASE_DB_USER" -e PGDATABASE="$SUPABASE_DB_NAME" \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            -v "$work_dir:/backup" "$pg_image" \
            pg_dump --format=custom --no-owner --no-privileges \
              --file=/backup/database.dump

          docker run --rm --network host \
            -e PGHOST="$SUPABASE_DB_HOST" -e PGPORT="$SUPABASE_DB_PORT" \
            -e PGUSER="$SUPABASE_DB_USER" -e PGDATABASE="$SUPABASE_DB_NAME" \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            "$pg_image" psql --no-psqlrc --no-align --tuples-only --csv \
              --command="SELECT rolname, rolsuper, rolinherit, rolcreaterole, rolcreatedb, rolcanlogin, rolreplication, rolbypassrls, rolconnlimit, rolvaliduntil, rolconfig FROM pg_roles ORDER BY rolname" \
              > "$work_dir/roles.csv"
          if [[ ! -s "$work_dir/roles.csv" ]]; then
            echo "::error::Role metadata export was empty; refusing to continue."
            exit 1
          fi

          bucket_count=0
          rclone lsf --dirs-only --format p --log-level ERROR "supabase:" > "$work_dir/buckets.txt"
          while IFS= read -r bucket_path; do
            bucket="${bucket_path%/}"
            [[ -n "$bucket" ]] || continue
            bucket_count=$((bucket_count + 1))
            mkdir -p "$work_dir/storage/$bucket"
            rclone copy --log-level ERROR --transfers 4 --checkers 8 \
              "supabase:$bucket" "$work_dir/storage/$bucket"
          done < "$work_dir/buckets.txt"
          if (( bucket_count == 0 )); then
            echo "::error::No Supabase Storage buckets were listed; refusing to create an incomplete backup."
            exit 1
          fi
          tar -czf "$work_dir/storage.tar.gz" -C "$work_dir/storage" .
          object_count="$(find "$work_dir/storage" -type f | wc -l | tr -d '[:space:]')"

          gpg --batch --yes --pinentry-mode loopback --symmetric \
            --cipher-algo AES256 --s2k-digest-algo SHA256 \
            --passphrase-file "$key_file" --output "$work_dir/upload/database.dump.gpg" \
            "$work_dir/database.dump"
          gpg --batch --yes --pinentry-mode loopback --symmetric \
            --cipher-algo AES256 --s2k-digest-algo SHA256 \
            --passphrase-file "$key_file" --output "$work_dir/upload/storage.tar.gz.gpg" \
            "$work_dir/storage.tar.gz"
          gpg --batch --yes --pinentry-mode loopback --symmetric \
            --cipher-algo AES256 --s2k-digest-algo SHA256 \
            --passphrase-file "$key_file" --output "$work_dir/upload/roles.csv.gpg" \
            "$work_dir/roles.csv"

          gpg --batch --quiet --pinentry-mode loopback --decrypt \
            --passphrase-file "$key_file" --output "$work_dir/database-verify.dump" \
            "$work_dir/upload/database.dump.gpg"
          docker run --rm -v "$work_dir:/backup" "$pg_image" \
            pg_restore --list /backup/database-verify.dump >/dev/null
          gpg --batch --quiet --pinentry-mode loopback --decrypt \
            --passphrase-file "$key_file" --output "$work_dir/storage-verify.tar.gz" \
            "$work_dir/upload/storage.tar.gz.gpg"
          tar -tzf "$work_dir/storage-verify.tar.gz" >/dev/null
          gpg --batch --quiet --pinentry-mode loopback --decrypt \
            --passphrase-file "$key_file" --output "$work_dir/roles-verify.csv" \
            "$work_dir/upload/roles.csv.gpg"
          test -s "$work_dir/roles-verify.csv"

          {
            printf 'created_utc=%s\n' "$stamp"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'database_server_major=%s\n' "$server_major"
            printf 'storage_bucket_count=%s\n' "$bucket_count"
            printf 'storage_object_count=%s\n' "$object_count"
            (cd "$work_dir/upload" && sha256sum database.dump.gpg storage.tar.gz.gpg roles.csv.gpg)
          } > "$work_dir/upload/manifest.txt"

          rclone copy --log-level ERROR "$work_dir/upload" "$remote_dir"
          rclone check --log-level ERROR --download --one-way "$work_dir/upload" "$remote_dir"
          echo "Encrypted database, Storage, and role-metadata archives uploaded and checksum-verified."
          echo "No production records or Storage objects were modified."
